# Shelf Recon (Shopify Embedded App)
# This file is used by Shopify CLI.

name = "Shelf Recon"
client_id = "e7c445f18968926cb46c11ea84e5edd2"
application_url = "https://shelf-recon.up.railway.app"
embedded = true

[access_scopes]
scopes = "read_products,write_products,read_inventory,read_content,write_content"

[auth]
redirect_urls = [
  "https://shelf-recon.up.railway.app/auth/callback",
  "https://shelf-recon.up.railway.app/auth/shopify/callback",
  "https://shelf-recon.up.railway.app/api/auth/callback"
]

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes-update"
